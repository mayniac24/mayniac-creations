name: music-check

# Look a song up in Meta's licensed catalogue and print the matches. It posts nothing, writes nothing and commits
# nothing (contents: read). Run it from the Actions tab, or:
#   gh workflow run music-check -f artist="Kavinsky" -f title="Nightcall"
on:
  workflow_dispatch:
    inputs:
      artist:
        description: "Artist, as Instagram lists it"
        required: true
        type: string
      title:
        description: "Song title, as Instagram lists it"
        required: true
        type: string

permissions:
  contents: read

jobs:
  music-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Look the song up
        # The inputs go through the environment, never into the script text (no shell injection).
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          FB_IG_USER_ID: ${{ secrets.FB_IG_USER_ID }}
          ARTIST: ${{ inputs.artist }}
          TITLE: ${{ inputs.title }}
        run: python scripts/music_check.py --artist "$ARTIST" --title "$TITLE"
